<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="app.css">
<style>body{margin:0;background:#0b1220;font-family:system-ui,sans-serif}.t{color:#888;font-size:10px;font-family:monospace;padding:4px}</style>
</head><body>
<div class="t">A) Compositor: textarea con display:block (correccion)</div>
<div style="width:360px"><div class="relative flex items-end gap-2 border-t border-border bg-panel/90 p-2.5">
<div class="flex flex-1 items-end gap-1 rounded-3xl bg-input px-3 py-1.5">
<button id="masB" class="grid size-8 shrink-0 place-items-center text-muted-foreground"><span class="grid size-5 place-items-center rounded-full bg-primary text-white"><svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span></button>
<div class="relative min-w-0 flex-1"><textarea id="campoB" rows="1" placeholder="Mensaje" class="block max-h-24 w-full flex-1 resize-none bg-transparent py-1.5 text-sm leading-5 outline-none"></textarea></div>
<button class="grid size-8 shrink-0 place-items-center text-muted-foreground"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="10" rx="4"/></svg></button>
<button class="grid size-8 shrink-0 place-items-center text-muted-foreground"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-3-6"/></svg></button>
</div>
<button id="enviarB" class="grid size-11 shrink-0 place-items-center rounded-full bg-primary text-primary-foreground"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/></svg></button>
</div></div>

<div class="t">B) Compositor: wrapper flex (otra correccion)</div>
<div style="width:360px"><div class="relative flex items-end gap-2 border-t border-border bg-panel/90 p-2.5">
<div class="flex flex-1 items-end gap-1 rounded-3xl bg-input px-3 py-1.5">
<button id="masC" class="grid size-8 shrink-0 place-items-center text-muted-foreground"><span class="grid size-5 place-items-center rounded-full bg-primary text-white"><svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span></button>
<div class="relative flex min-w-0 flex-1 items-center"><textarea id="campoC" rows="1" placeholder="Mensaje" class="max-h-24 w-full resize-none bg-transparent py-1.5 text-sm leading-5 outline-none"></textarea></div>
<button class="grid size-8 shrink-0 place-items-center text-muted-foreground"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="10" rx="4"/></svg></button>
<button class="grid size-8 shrink-0 place-items-center text-muted-foreground"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-3-6"/></svg></button>
</div>
<button class="grid size-11 shrink-0 place-items-center rounded-full bg-primary text-primary-foreground"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/></svg></button>
</div></div>

<div class="t">C) Aviso nuevo con letra del sistema agrandada (zoom 1.4)</div>
<div style="width:360px;zoom:1.4"><div id="avisoZ" class="flex w-full items-center gap-2 border-b border-border bg-card/60 px-3 py-2 text-[11px] text-muted-foreground">
<span class="grid size-6 shrink-0 place-items-center rounded-full bg-primary/15">
<svg id="relojZ" class="size-3.5 overflow-visible text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
<span class="min-w-0 flex-1 leading-snug">Los mensajes temporales están activados · 24 horas</span></div></div>

<pre id="resultado" style="color:#22ff88;font-size:12px">midiendo</pre>
<script>
function comp(mas, campo, env){
  var a = document.getElementById(mas).getBoundingClientRect();
  var b = document.getElementById(campo).getBoundingClientRect();
  var c = env ? document.getElementById(env).getBoundingClientRect() : null;
  var cen = function(x){ return Number((x.top + x.height/2).toFixed(1)); };
  return { altoCampo: Number(b.height.toFixed(1)), altoBoton: Number(a.height.toFixed(1)),
    dif: Number(Math.abs(cen(a)-cen(b)).toFixed(1)),
    difVsEnviar: c ? Number(Math.abs(cen(a)-cen(c)).toFixed(1)) : null,
    masDebajoDelTexto: a.top > b.top + 2 };
}
function avisoZ(){
  var c = document.getElementById('avisoZ'), s = document.getElementById('relojZ');
  var rc = c.getBoundingClientRect(), rs = s.getBoundingClientRect();
  return { relojW: Number(rs.width.toFixed(1)), relojH: Number(rs.height.toFixed(1)),
    margenIzq: Math.round(rs.left - rc.left), desborde: c.scrollWidth - c.clientWidth,
    cortado: (rs.left - rc.left) < 3 || rs.width < 11.5 };
}
function todo(){
  document.getElementById('resultado').textContent = 'RESULTADO:' + JSON.stringify({
    block: comp('masB','campoB','enviarB'),
    wrapperFlex: comp('masC','campoC',null),
    avisoZoom: avisoZ()
  });
}
todo(); setTimeout(todo, 300);
</script></body></html>
